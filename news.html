<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media · Health AI Research Group · Maastricht University</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>

    .news-search { position:relative; margin-bottom:16px; }
    .news-search input {
      width:100%; padding:11px 40px 11px 42px; font-size:0.95rem;
      border:1px solid var(--border); border-radius: var(--radius-lg);
      background:var(--white); color:var(--slate); outline:none;
      transition: border-color var(--transition), box-shadow var(--transition);
      box-sizing:border-box;
    }
    .news-search input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .news-search .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1rem; pointer-events:none; }
    .news-search .search-clear { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:1.1rem; line-height:1; padding:0; display:none; }

    .type-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px; }
    .type-filter {
      padding:5px 14px; border-radius:99px; font-size:0.82rem; font-weight:600;
      border:1px solid var(--border); background:var(--white); color:var(--text-muted);
      cursor:pointer; transition: all var(--transition);
    }
    .type-filter:hover { border-color:var(--slate); color:var(--slate); }
    .type-filter.active { background:var(--slate); color:white; border-color:var(--slate); }

    .social-note { font-size:0.78rem; color:var(--text-muted); margin:-14px 0 20px; display:none; }
    .social-note a { color:inherit; }
    .social-note.show { display:block; }


  </style>
</head>
<body class="page-body">
<script src="nav.js?v=3"></script>
<script src="cms.js?v=3"></script>

<div class="page-hero">
  <div class="container">
    <span class="section-label">The latest news</span>
    <h1>News & Media</h1>
    <p class="lead">News, press, blog posts, talks, and podcasts from the Health AI Research Group.</p>
  </div>
</div>

<section>
  <div class="container">
    <div class="loading" id="loading"><div class="spinner"></div> Loading…</div>
    <div id="mediaPage" class="hidden" style="max-width:780px">
      <div class="news-search">
        <span class="search-icon">🔍</span>
        <input type="search" id="newsSearch" placeholder="Search news, blog posts, talks, podcasts…" oninput="renderItems()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()" title="Clear">✕</button>
      </div>
      <div class="type-filters">
        <button class="type-filter active" data-type="all"     onclick="setFilter(this)">All</button>
        <button class="type-filter"        data-type="news"    onclick="setFilter(this)">News</button>
        <button class="type-filter"        data-type="talk"    onclick="setFilter(this)">Presentations</button>
        <button class="type-filter"        data-type="blog"    onclick="setFilter(this)">Blog posts</button>
        <button class="type-filter"        data-type="podcast" onclick="setFilter(this)">Podcasts</button>
        <button class="type-filter"        data-type="social"  onclick="setFilter(this)">LinkedIn</button>
      </div>
      <div id="socialNote" class="social-note"></div>
      <div id="itemsList"></div>
    </div>
  </div>
</section>

<script>
let _items = [];
let _activeFilter = 'all';

(async () => {
  const data = await CMS.load('content/news.yaml');
  // Generated hourly from the DACS LinkedIn page; absent on a fresh checkout
  // that has not run scripts/fetch_linkedin_posts.py yet.
  let social = {};
  try { social = await CMS.load('content/linkedin.generated.yaml') || {}; } catch (e) {}

  document.getElementById('loading').remove();
  document.getElementById('mediaPage').classList.remove('hidden');

  _items = CMS.normalizeNewsItems({ ...data, social: social.social || [] });
  if (social.source) {
    const n = document.getElementById('socialNote');
    n.innerHTML = `LinkedIn items are posts from the <a href="${social.source.url}" target="_blank" rel="noopener">${social.source.name}</a> page that name someone on this site. Collected automatically, last change ${social.source.fetched}.`;
  }

  renderItems();
  CMS.revealNew(document.getElementById('mediaPage'));
})();

function renderItems() {
  const q = (document.getElementById('newsSearch').value || '').trim().toLowerCase();
  document.getElementById('searchClear').style.display = q ? 'block' : 'none';

  const hits = _items.filter(item => {
    // LinkedIn posts are collected automatically and nobody signs off on
    // them, so they stay behind their own tab rather than mixing into the
    // edited news list.
    const typeOk = _activeFilter === 'all' ? item.type !== 'social' : item.type === _activeFilter;
    const textOk = !q || item.search.toLowerCase().includes(q);
    return typeOk && textOk;
  });

  const list = document.getElementById('itemsList');
  if (!hits.length) {
    list.innerHTML = `<div class="no-results">No results${q ? ` for "<strong>${q}</strong>"` : ''}.</div>`;
    return;
  }
  list.innerHTML = hits.map(h => CMS.renderNewsItem(h)).join('');
  CMS.trimMore(list);
}


function setFilter(btn) {
  _activeFilter = btn.dataset.type;
  document.querySelectorAll('.type-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const note = document.getElementById('socialNote');
  note.classList.toggle('show', _activeFilter === 'social' && !!note.innerHTML);
  renderItems();
}

function clearSearch() {
  document.getElementById('newsSearch').value = '';
  renderItems();
  document.getElementById('newsSearch').focus();
}
</script>
</body>
</html>
