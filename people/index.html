<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Profile · Health AI Research Group · Maastricht University</title>
  <base href="../" />
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    /* ── Hero ── */
    #personPage .page-hero { background: var(--slate); border-bottom-color: transparent; padding: 32px 0 28px; }
    .person-hero-inner { display: flex; gap: 36px; align-items: flex-start; }
    .person-avatar-lg {
      width: 130px; height: 130px; flex-shrink: 0; border-radius: 50%;
      overflow: hidden; background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif; font-size: 2.8rem; font-weight: 700;
      color: rgba(255,255,255,0.35);
    }
    .person-avatar-lg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
    .person-hero-text { flex: 1; }
    .person-hero-text .back-link {
      font-size: 0.78rem; color: rgba(255,255,255,0.4); text-decoration: none;
      display: inline-block; margin-bottom: 14px; transition: color var(--transition);
    }
    .person-hero-text .back-link:hover { color: rgba(255,255,255,0.7); }
    .person-hero-text h1 { color: white; margin-bottom: 6px; line-height: 1.15; }
    .person-hero-role { color: rgba(46,143,160,0.9); font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; }
    .person-hero-dept { color: rgba(255,255,255,0.45); font-size: 0.8rem; margin-bottom: 22px; }
    /* The 22px above is the gap before the stats row. When a second line
       follows, that gap belongs after the pair, not between them. */
    .person-hero-dept.has-next { margin-bottom: 4px; }
    .hero-stat-row { display: flex; gap: 32px; }
    .hero-stat-val { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; color: white; line-height: 1; }
    .hero-stat-lbl { font-size: 0.7rem; color: rgba(255,255,255,0.45); margin-top: 3px; }

    /* ── Profile sections ── */
    .profile-content { max-width: 900px; padding-top: 12px; padding-bottom: 80px; }

    /* ── Contents row: the same sticky sub-nav research.html and students.html
       use, narrowed to the profile column. It sits under the bio, so it lists
       the sections below it and nothing above. ── */
    .profile-contents {
      position: sticky; top: var(--nav-h); z-index: 9;
      display: flex; gap: 0 4px; overflow-x: auto;
      background: var(--white);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .profile-contents a {
      padding: 11px 12px; font-size: 0.84rem; font-weight: 500;
      color: var(--text-muted); border-bottom: 2px solid transparent;
      margin-bottom: -1px; white-space: nowrap;
      text-decoration: none; transition: all var(--transition);
    }
    .profile-contents a:hover { color: var(--slate); }
    .profile-contents a.active { color: var(--slate); border-bottom-color: var(--slate); font-weight: 600; }
    .profile-contents .pc-n { font-weight: 400; opacity: 0.6; margin-left: 5px; }
    /* Clears the site nav plus this row when a jump lands. */
    .profile-section { scroll-margin-top: 120px; }
    .profile-tags { margin-top: 14px; }
    .profile-lead-line { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px; }
    .profile-lead-line a { color: inherit; text-decoration: underline; text-decoration-color: var(--border-mid); }
    .grant-year a { color: inherit; text-decoration: none; }
    .grant-year a:hover { text-decoration: underline; }
    .profile-section { margin-bottom: 52px; }
    .profile-section-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: 1.5px solid var(--border);
    }
    .profile-bio { font-size: 0.92rem; line-height: 1.85; color: var(--text-muted); }

    /* ── Grants: one row per grant, year in a fixed left column ── */
    .grant-list { list-style: none; margin: 0; padding: 0; }
    .grant-row { display: flex; gap: 18px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .grant-row:last-child { border-bottom: 0; }
    .grant-year { flex: 0 0 84px; font-size: 0.8rem; font-weight: 600; color: var(--blue-mid); padding-top: 2px; }
    .grant-title { font-size: 0.92rem; line-height: 1.5; color: var(--text); }
    .grant-title a { color: inherit; text-decoration: underline; text-decoration-color: var(--border-mid); }
    .grant-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    /* ── Open science: filter chips over a two-column card grid ── */
    .open-chips { margin-bottom: 16px; }
    .open-chip-n { font-weight: 400; opacity: 0.65; margin-left: 2px; }
    .open-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .open-card {
      display: flex; flex-direction: column; gap: 6px; padding: 16px 18px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--white);
      text-decoration: none; color: inherit; box-shadow: var(--card-shadow);
      transition: all var(--transition);
    }
    .open-card:hover { border-color: var(--blue); box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
    .open-card-top { display: flex; justify-content: space-between; align-items: center; }
    .open-card-year { font-size: 0.76rem; color: var(--text-light); }
    .open-card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; color: var(--slate); overflow-wrap: anywhere; }
    .open-card-note { font-size: 0.82rem; line-height: 1.55; color: var(--text-muted); }
    .open-card-foot {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      margin-top: auto; padding-top: 6px; font-size: 0.78rem; color: var(--text-muted);
    }
    .open-card-host { flex: none; color: var(--blue-mid); font-weight: 600; }
    .open-tag-thesis_software { background: var(--gold-light); color: #9a6010; }
    .open-tag-model, .open-tag-dataset { background: var(--slate-light); color: var(--slate-mid); }
    .open-tag-material { background: var(--bg-alt); color: var(--text-muted); }
    .open-more {
      display: block; margin: 16px auto 0; padding: 7px 18px; border-radius: 20px; cursor: pointer;
      font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--blue-mid);
      background: var(--white); border: 1.5px solid var(--border); transition: all var(--transition);
    }
    .tl-body { flex: 1; min-width: 0; }
    .tl-tag { flex: none; align-self: flex-start; margin-top: 2px; }
    .tl-tag-media, .tl-tag-phd { background: var(--gold-light); color: #9a6010; }
    .tl-tag-organisation, .tl-tag-conference { background: var(--slate-light); color: var(--slate-mid); }
    .grant-meta a { color: inherit; text-decoration: underline; text-decoration-color: var(--border-mid); }
    .open-more:hover { border-color: var(--blue); background: var(--blue-light); }

    @media (max-width: 600px) {
      .person-hero-inner { flex-direction: column; gap: 18px; }
      .person-avatar-lg { width: 90px; height: 90px; font-size: 2rem; }
      .grant-row { flex-direction: column; gap: 2px; }
      .grant-year { flex-basis: auto; }
      .open-grid { grid-template-columns: 1fr; }
      .tl-tag { margin-top: 4px; }
    }
  </style>
</head>
<body class="page-body">
<script src="nav.js?v=4"></script>
<script src="cms.js?v=4"></script>

<div class="loading" id="loading"><div class="spinner"></div> Loading…</div>

<div id="notFound" class="hidden">
  <div class="page-hero">
    <div class="container">
      <span class="section-label">Not found</span>
      <h1>Person not found</h1>
      <p class="lead">No team member matches that profile URL.</p>
      <a href="people.html" class="btn btn-primary" style="margin-top:16px">← Back to People</a>
    </div>
  </div>
</div>

<div id="personPage" class="hidden">
  <div class="page-hero">
    <div class="container">
      <div class="person-hero-inner">
        <div class="person-avatar-lg" id="heroAvatar"></div>
        <div class="person-hero-text">
          <a href="people.html" class="back-link">← People</a>
          <h1 id="heroName"></h1>
          <div class="person-hero-role" id="heroRole"></div>
          <div class="person-hero-dept" id="heroDept">Dept. of Advanced Computing Sciences · Maastricht University</div>
          <div class="person-hero-dept" id="heroFunding" hidden></div>
          <div class="hero-stat-row" id="heroStats"></div>
        </div>
      </div>
    </div>
  </div>

  <section>
    <div class="container profile-content">
      <div class="profile-section" id="about"></div>
      <div class="profile-contents" id="profileContents" hidden></div>
      <div class="profile-section" id="projects"></div>
      <div class="profile-section" id="thesis"></div>
      <div class="profile-section" id="grants"></div>
      <div class="profile-section" id="open-science"></div>
      <div class="profile-section" id="impact"></div>
      <div class="profile-section" id="committees"></div>
      <div class="profile-section" id="links"></div>
      <div class="profile-section" id="activity"></div>
      <div class="profile-section" id="publications"></div>
    </div>
  </section>
</div>

<script>
const { icon: ICON, ICONS, esc } = CMS;

function imgSrc(url) { return url || ''; }

const fmt = n => Number(n).toLocaleString();

(async () => {
  const slug = new URLSearchParams(location.search).get('id');
  if (!slug) {
    document.getElementById('loading').remove();
    document.getElementById('notFound').classList.remove('hidden');
    return;
  }

  const [people, news, pubData, students, research] = await Promise.all([
    CMS.load('content/people.yaml'),
    CMS.load('content/news.yaml'),
    CMS.load('content/publications.generated.yaml').catch(() => ({ publications: [] })),
    // Only for the thesis block below. A profile is still worth showing if
    // this one file fails, so it degrades to no thesis rather than no page.
    CMS.load('content/students.yaml').catch(() => ({ highlights: [] })),
    // Projects and themes, same treatment: a profile without its projects
    // beats no profile at all.
    CMS.load('content/research.yaml').catch(() => ({ themes: [], projects: [] })),
  ]);

  document.getElementById('loading').remove();

  const person = (Array.isArray(people) ? people : []).find(p => p.slug === slug);
  if (!person) {
    document.getElementById('notFound').classList.remove('hidden');
    return;
  }

  document.getElementById('pageTitle').textContent = `${person.name} · Health AI Research Group`;

  // Hero
  const src = imgSrc(person.image_url);
  document.getElementById('heroAvatar').innerHTML = src
    ? `<img src="${src}" alt="${person.name}">`
    : CMS.initials(person.name);
  document.getElementById('heroName').textContent = person.name;
  // Say so when someone has left, rather than showing a bare role that reads
  // as current. Their page stays up: the work happened.
  document.getElementById('heroRole').textContent = person.alumni
    ? `${person.role} (alumni${person.alumni_until ? `, until ${person.alumni_until}` : ''})`
    : person.role;
  // Externally funded PhD candidates are Maastricht candidates like any
  // other, so this is an extra line rather than a change to the two above.
  const funding = document.getElementById('heroFunding');
  funding.textContent = 'Externally funded';
  funding.hidden = !person.external;
  document.getElementById('heroDept').classList.toggle('has-next', !!person.external);

  const allPubs = (pubData.publications || []);
  const myPubs = allPubs.filter(pub => person.orcid && (pub.orcids || []).includes(person.orcid));
  const totalCites = myPubs.reduce((s, p) => s + (p.citations || 0), 0);

  if (myPubs.length) {
    document.getElementById('heroStats').innerHTML = `
      <div><div class="hero-stat-val">${myPubs.length}</div><div class="hero-stat-lbl">Publications</div></div>
      <div><div class="hero-stat-val">${fmt(totalCites)}</div><div class="hero-stat-lbl">Citations</div></div>`;
  }

  // Bio
  if (person.bio && person.bio.trim() && !person.bio.includes('TODO')) {
    document.getElementById('about').innerHTML = `
      <div class="profile-section-title">About</div>
      <p class="profile-bio">${person.bio.trim()}</p>`;
  }

  // Themes and keywords are context for the bio rather than a section of
  // their own, so they sit under it. As a section they were a heading over
  // two rows of chips, which is what the Projects section below now uses the
  // space for. Each theme links to its section on the research page.
  const themes = (person.themes || []).filter(Boolean);
  const kws = (person.keywords || []).filter(Boolean);
  const themeId = Object.fromEntries((research.themes || []).map(t => [t.title, t.id]));
  const ledThemes = (research.themes || []).filter(t => (t.leads || []).map(x => x.trim()).includes(person.name));
  if (themes.length || kws.length || ledThemes.length) {
    let html = '';
    if (themes.length) html += `<div class="tag-row${kws.length ? ' mb-8' : ''} profile-tags">${themes.map(t =>
      themeId[t]
        ? `<a class="tag" href="research.html#theme-${esc(themeId[t])}">${esc(t)}</a>`
        : `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
    if (kws.length) html += `<div class="tag-row">${kws.map(k => `<span class="tag tag-muted">${esc(k)}</span>`).join('')}</div>`;
    if (ledThemes.length) html += `<div class="profile-lead-line">Theme lead · ${ledThemes.map(t =>
      `<a href="research.html#theme-${esc(t.id)}">${esc(t.title)}</a>`).join(' · ')}</div>`;
    document.getElementById('about').innerHTML += html;
  }

  // The projects this person is on, read from research.yaml by team
  // membership. projects.html has always linked to profiles; nothing linked
  // back, so the funded work someone does was the one thing a profile left
  // out. Theme leadership rides along, since it comes from the same file.
  const myProjects = (research.projects || []).filter(p => (p.team || []).includes(person.name));
  if (myProjects.length) {
    const rows = myProjects.map(p => {
      const meta = [p.funder, p.period, p.amount].filter(Boolean).map(esc).join(' · ');
      const name = p.title && p.title.trim() && p.title.trim() !== p.acronym ? p.title.trim() : p.acronym;
      return `<li class="grant-row">
        <div class="grant-year"><a href="projects.html#${encodeURIComponent(p.acronym)}">${esc(p.acronym)}</a></div>
        <div class="tl-body">
          <div class="grant-title">${esc(name)}</div>
          ${meta ? `<div class="grant-meta">${meta}</div>` : ''}
        </div>
        ${p.status ? `<span class="tag tl-tag ${p.status === 'Active' ? 'tag-active' : 'tag-muted'}">${esc(p.status)}</span>` : ''}
      </li>`;
    }).join('');
    document.getElementById('projects').innerHTML =
      `<div class="profile-section-title">Projects</div><ul class="grant-list">${rows}</ul>`;
  }

  // Their own doctoral thesis, if the group supervised it. Same card as the
  // students page uses, from CMS.thesisCard.
  const thesis = CMS.thesisFor(person.name, students);
  if (thesis) {
    document.getElementById('thesis').innerHTML =
      '<div class="profile-section-title">Doctoral thesis</div>' + CMS.thesisCard(thesis);
  }

  // Grants and prizes awarded to this person, from the optional `grants` list
  // on their people.yaml entry. Shown in file order, which is newest first.
  const grants = (person.grants || []).filter(g => g && g.title);
  if (grants.length) {
    document.getElementById('grants').innerHTML = `
      <div class="profile-section-title">Grants &amp; Awards</div>
      <ul class="grant-list">${grants.map(g => {
        const title = g.url
          ? `<a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>`
          : esc(g.title);
        const meta = [g.funder, g.role].filter(Boolean).map(esc).join(' · ');
        return `<li class="grant-row">
          <div class="grant-year">${esc(g.year || '')}</div>
          <div>
            <div class="grant-title">${title}</div>
            ${meta ? `<div class="grant-meta">${meta}</div>` : ''}
          </div>
        </li>`;
      }).join('')}</ul>`;
  }

  // Open science: software, models, datasets and materials, from the optional
  // `open_science` list. Shown as a card grid with a filter per kind; each
  // filter shows its first OPEN_LIMIT cards and a button for the rest. File
  // order is kept within a kind. The host label is read off the URL.
  const openItems = (person.open_science || []).filter(o => o && o.title && o.url);
  if (openItems.length) {
    const OPEN_LIMIT = 6;
    const kinds = [
      { id: 'software', label: 'Software', tag: 'Software', types: ['software'] },
      { id: 'theses',   label: 'Student theses', tag: 'Thesis code', types: ['thesis_software'] },
      { id: 'data',     label: 'Models & datasets', types: ['model', 'dataset'] },
      { id: 'material', label: 'Talks & materials', tag: 'Material', types: ['material'] },
    ];
    const tagFor = o => o.type === 'model' ? 'Model' : o.type === 'dataset' ? 'Dataset'
      : (kinds.find(k => k.types.includes(o.type)) || {}).tag || 'Other';
    const host = u => /github\.(com|io)/.test(u) ? 'GitHub' : /gitlab\.com/.test(u) ? 'GitLab'
      : /huggingface\.co/.test(u) ? 'Hugging Face' : /zenodo/.test(u) ? 'Zenodo' : 'Link';
    // Sorted by kind so "All" reads in the same order as the filters.
    const rank = o => { const i = kinds.findIndex(k => k.types.includes(o.type)); return i < 0 ? kinds.length : i; };
    const sorted = openItems.map((o, i) => [o, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);
    const card = o => `
      <a class="open-card" href="${esc(o.url)}" target="_blank" rel="noopener">
        <div class="open-card-top">
          <span class="tag open-tag-${esc(o.type)}">${tagFor(o)}</span>
          <span class="open-card-year">${esc(o.year || '')}</span>
        </div>
        <div class="open-card-title">${esc(o.title)}</div>
        ${o.note ? `<div class="open-card-note">${esc(o.note)}</div>` : ''}
        <div class="open-card-foot">
          <span>${o.by ? esc(o.by) : ''}</span>
          <span class="open-card-host">${host(o.url)} ↗</span>
        </div>
      </a>`;
    let active = 'all', expanded = false;
    const sec = document.getElementById('open-science');
    const render = () => {
      const kind = kinds.find(k => k.id === active);
      const list = kind ? sorted.filter(o => kind.types.includes(o.type)) : sorted;
      const shown = expanded ? list : list.slice(0, OPEN_LIMIT);
      const chips = [{ id: 'all', label: 'All', n: sorted.length }]
        .concat(kinds.map(k => ({ id: k.id, label: k.label, n: sorted.filter(o => k.types.includes(o.type)).length })))
        .filter(c => c.n);
      sec.innerHTML = `
        <div class="profile-section-title">Open Science</div>
        <div class="filter-chips open-chips">${chips.map(c =>
          `<button class="chip${c.id === active ? ' active' : ''}" data-kind="${c.id}">${c.label} <span class="open-chip-n">${c.n}</span></button>`).join('')}</div>
        <div class="open-grid">${shown.map(card).join('')}</div>
        ${list.length > OPEN_LIMIT ? `<button class="open-more" data-more>${expanded ? 'Show fewer' : `Show all ${list.length}`}</button>` : ''}`;
    };
    sec.addEventListener('click', e => {
      const chip = e.target.closest('[data-kind]');
      if (chip) { active = chip.dataset.kind; expanded = false; render(); return; }
      if (e.target.closest('[data-more]')) { expanded = !expanded; render(); }
    });
    render();
  }

  // Impact and Committees: optional `impact` and `committees` lists, shown as
  // year-led rows with a filter per kind. "All" keeps file order, which is
  // grouped by kind and newest first within it; a small tag names the kind.
  // `person` is the slug of someone with a profile on this site. The note
  // opens with their name, so link that first segment to their page.
  const noteHtml = o => {
    if (!o.note) return '';
    if (!o.person) return esc(o.note);
    const [who, ...rest] = String(o.note).split(' · ');
    // The page sets <base href="../">, so the link is written from the site
    // root, the same way every other page links a profile.
    const link = `<a href="people/?id=${encodeURIComponent(o.person)}">${esc(who)}</a>`;
    return rest.length ? `${link} · ${esc(rest.join(' · '))}` : link;
  };
  const renderTimeline = (secId, heading, items, kinds, limit = 6) => {
    const list0 = (items || []).filter(o => o && o.title);
    if (!list0.length) return;
    const sec = document.getElementById(secId);
    const labelOf = t => (kinds.find(k => k.id === t) || {}).tag || '';
    let active = 'all', expanded = false;
    const render = () => {
      const list = active === 'all' ? list0 : list0.filter(o => o.type === active);
      const shown = expanded ? list : list.slice(0, limit);
      const chips = [{ id: 'all', label: 'All', n: list0.length }]
        .concat(kinds.map(k => ({ id: k.id, label: k.label, n: list0.filter(o => o.type === k.id).length })))
        .filter(c => c.n);
      sec.innerHTML = `
        <div class="profile-section-title">${heading}</div>
        ${chips.length > 2 ? `<div class="filter-chips open-chips">${chips.map(c =>
          `<button class="chip${c.id === active ? ' active' : ''}" data-kind="${c.id}">${c.label} <span class="open-chip-n">${c.n}</span></button>`).join('')}</div>` : ''}
        <ul class="grant-list">${shown.map(o => {
          const title = o.url
            ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a>` : esc(o.title);
          const tag = active === 'all' && labelOf(o.type)
            ? `<span class="tag tl-tag tl-tag-${esc(o.type)}">${labelOf(o.type)}</span>` : '';
          return `<li class="grant-row">
            <div class="grant-year">${esc(o.year || '')}</div>
            <div class="tl-body">
              <div class="grant-title">${title}</div>
              ${o.note ? `<div class="grant-meta">${noteHtml(o)}</div>` : ''}
            </div>
            ${tag}
          </li>`;
        }).join('')}</ul>
        ${list.length > limit ? `<button class="open-more" data-more>${expanded ? 'Show fewer' : `Show all ${list.length}`}</button>` : ''}`;
    };
    sec.addEventListener('click', e => {
      const chip = e.target.closest('[data-kind]');
      if (chip) { active = chip.dataset.kind; expanded = false; render(); return; }
      if (e.target.closest('[data-more]')) { expanded = !expanded; render(); }
    });
    render();
  };
  renderTimeline('impact', 'Impact', person.impact, [
    { id: 'talk', label: 'Talks', tag: 'Talk' },
    { id: 'media', label: 'Media & outreach', tag: 'Outreach' },
    { id: 'organisation', label: 'Conference organisation', tag: 'Organisation' },
  ]);
  renderTimeline('committees', 'Committees', person.committees, [
    { id: 'phd', label: 'PhD committees', tag: 'PhD' },
    { id: 'conference', label: 'Conference committees', tag: 'Conference' },
  ]);

  // Links
  const links = CMS.personLinks(person);
  if (links.length) {
    document.getElementById('links').innerHTML = `
      <div class="profile-section-title">Links</div>
      <div class="person-links">${links.join('')}</div>`;
  }

  // Publications browser
  if (myPubs.length) {
    CMS.PubBrowser.init(document.getElementById('publications'), myPubs, {
      highlightName: person.name.split(' ').pop(),
      pageSize: 20,
      scrollTarget: 'publications',
      sectionTitle: 'Publications',
      onFilter: filtered => {
        const cites = filtered.reduce((s, p) => s + (p.citations || 0), 0);
        const isFiltered = filtered.length !== myPubs.length;
        document.getElementById('heroStats').innerHTML = `
          <div>
            <div class="hero-stat-val">${filtered.length}</div>
            <div class="hero-stat-lbl">${isFiltered ? 'Matching pubs' : 'Publications'}</div>
          </div>
          <div>
            <div class="hero-stat-val">${fmt(cites)}</div>
            <div class="hero-stat-lbl">Citations</div>
          </div>`;
      },
    });
  }

  // Activity
  const personName = person.name.toLowerCase();
  const activity = CMS.normalizeNewsItems(news)
    .filter(item => item.search.toLowerCase().includes(personName));
  if (activity.length) {
    document.getElementById('activity').innerHTML = `
      <div class="profile-section-title">News & Activity</div>
      ${activity.map(item => CMS.renderNewsItem(item)).join('')}`;
  }

  // ── Contents row ──
  // Built from the sections that actually rendered, because most profiles
  // fill three or four and a fixed list would advertise empty ones. The row
  // sits under the bio, so it lists only what follows it.
  const CONTENTS = [
    { id: 'projects',     label: 'Projects',     n: () => myProjects.length },
    { id: 'thesis',       label: 'Thesis' },
    { id: 'grants',       label: 'Grants',       n: () => grants.length },
    { id: 'open-science', label: 'Open Science', n: () => openItems.length },
    { id: 'impact',       label: 'Impact',       n: () => (person.impact || []).length },
    { id: 'committees',   label: 'Committees',   n: () => (person.committees || []).length },
    { id: 'links',        label: 'Links' },
    { id: 'activity',     label: 'News' },
    { id: 'publications', label: 'Publications', n: () => myPubs.length },
  ];
  const filled = CONTENTS.filter(s => {
    const el = document.getElementById(s.id);
    return el && el.innerHTML.trim();
  });
  // Two entries are not worth a row, and on a profile that thin it only
  // names how little is there. Three is the useful floor: a faculty page is
  // Projects, Links and a publication list hundreds of rows long.
  if (filled.length >= 3) {
    const row = document.getElementById('profileContents');
    const base = `people/?id=${encodeURIComponent(person.slug)}`;
    row.innerHTML = filled.map(s =>
      `<a href="${base}#${s.id}">${s.label}${s.n && s.n() ? ` <span class="pc-n">${s.n()}</span>` : ''}</a>`).join('');
    row.hidden = false;

    const els = filled.map(s => document.getElementById(s.id));
    const links = [...row.querySelectorAll('a')];
    const mark = () => {
      let cur = 0;
      els.forEach((el, i) => { if (el.getBoundingClientRect().top <= 150) cur = i; });
      links.forEach((a, i) => a.classList.toggle('active', i === cur));
    };
    window.addEventListener('scroll', mark, { passive: true });
    mark();
  }

  document.getElementById('personPage').classList.remove('hidden');
  CMS.revealNew(document.getElementById('personPage'));

  // The page renders only once its YAML has arrived, so the browser resolved
  // any #section in the URL while the page was still the loading spinner and
  // scrolled nowhere. Do it again now that the sections exist.
  if (location.hash) {
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) requestAnimationFrame(() => target.scrollIntoView());
  }
})();
</script>
</body>
</html>
