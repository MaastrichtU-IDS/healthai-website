<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students · HAIR Group · Maastricht University</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    .sticky-subnav {
      position: sticky; top: var(--nav-h); z-index: 10;
      background: var(--white); border-bottom: 1px solid var(--border); overflow-x: auto;
    }
    .sticky-subnav-inner { max-width: var(--max-w); margin: 0 auto; padding: 0 32px; display: flex; }
    .sticky-subnav a {
      padding: 13px 16px; font-size: 0.84rem; font-weight: 500;
      color: var(--text-muted); border-bottom: 2px solid transparent;
      margin-bottom: -1px; white-space: nowrap; transition: all var(--transition);
    }
    .sticky-subnav a:hover { color: var(--slate); }
    .sticky-subnav a.active { color: var(--slate); border-bottom-color: var(--slate); font-weight: 600; }

    .phil-row { display:flex; gap:24px; align-items:flex-start; padding:22px 0; border-bottom:1px solid var(--border); }
    .phil-icon { width:46px; height:46px; border-radius:10px; flex-shrink:0; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
    .phil-row h4 { font-size:0.97rem; margin-bottom:6px; }
    .phil-row p  { font-size:0.88rem; }

    .prog-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--card-shadow); transition:all var(--transition); }
    .prog-card:hover { box-shadow:var(--card-shadow-hover); transform:translateY(-2px); }
    .prog-card h4 { font-size:0.97rem; margin-bottom:8px; }
    .prog-card p  { font-size:0.84rem; margin-bottom:14px; }
    .prog-meta { font-size:0.76rem; color:var(--text-muted); display:flex; flex-direction:column; gap:4px; }

    .phd-steps { display:flex; flex-direction:column; gap:0; }
    .phd-step { display:grid; grid-template-columns:44px 1fr; gap:18px; padding-bottom:28px; position:relative; }
    .phd-step:not(:last-child)::before { content:''; position:absolute; left:20px; top:42px; bottom:0; width:1.5px; background:var(--border); }
    .step-num { width:42px; height:42px; border-radius:50%; background:var(--slate); color:white; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:1rem; flex-shrink:0; }
    .phd-step h4 { font-size:0.95rem; margin-bottom:6px; padding-top:8px; }
    .phd-step p  { font-size:0.86rem; }

    .req-item { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:0.87rem; }
    .req-item::before { content:'✦'; color:var(--blue); flex-shrink:0; font-size:0.75rem; padding-top:2px; }

    /* Level overview cards */
    .track-card { display:block; background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--card-shadow); transition:all var(--transition); text-decoration:none; color:inherit; }
    .track-card:hover { box-shadow:var(--card-shadow-hover); transform:translateY(-2px); border-color:var(--blue); }
    .track-card h4 { font-size:1rem; margin:12px 0 8px; }
    .track-card p  { font-size:0.85rem; margin-bottom:14px; }
    .track-more { font-size:0.8rem; font-weight:600; color:var(--blue); }

    .track-sub { font-size:0.95rem; margin-bottom:10px; }
    .thesis-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--card-shadow); transition:all var(--transition); margin-bottom:18px; }
    .thesis-card:hover { box-shadow:var(--card-shadow-hover); transform:translateY(-2px); }
    .thesis-title { font-family:'Fraunces',serif; font-size:1rem; font-weight:700; color:var(--slate); margin-bottom:6px; }
    .thesis-meta { font-size:0.8rem; color:var(--text-muted); margin-bottom:12px; }
    .thesis-abstract { font-size:0.86rem; margin:10px 0 12px; }
    .thesis-doi { font-size:0.74rem; color:var(--text-muted); font-family:monospace; }
    /* <details> gives open/closed, keyboard access and find-in-page for free. */
    .thesis-details { margin-bottom:12px; }
    .thesis-details > summary { cursor:pointer; font-size:0.8rem; font-weight:600; color:var(--blue); list-style:none; display:inline-flex; align-items:center; gap:6px; }
    .thesis-details > summary::-webkit-details-marker { display:none; }
    .thesis-details > summary::before { content:'▸'; font-size:0.7rem; transition:transform var(--transition); }
    .thesis-details[open] > summary::before { transform:rotate(90deg); }
    .route-note { font-size:0.78rem; color:var(--text-muted); margin-top:10px; padding-left:10px; border-left:2px solid var(--border); }
  </style>
</head>
<body class="page-body">
<script src="nav.js?v=2"></script>
<script src="cms.js?v=3"></script>

<div class="page-hero">
  <div class="container">
    <span class="section-label">For students</span>
    <h1>Study with us</h1>
    <p class="lead" id="heroLead"></p>
  </div>
</div>

<nav class="sticky-subnav">
  <div class="sticky-subnav-inner">
    <a href="#bachelor" class="active">Bachelor's</a>
    <a href="#master">Master's</a>
    <a href="#phd">PhD</a>
  </div>
</nav>

<div class="loading" id="loading" style="padding:80px 0"><div class="spinner"></div> Loading…</div>
<div id="studentPage" class="hidden">

<section id="tracksOverview" style="scroll-margin-top:120px">
  <div class="container">
    <div class="grid grid-3" id="trackCards"></div>
  </div>
</section>

<div id="trackSections"></div>

</div>

<script>
(async () => {
  // Themes and supervisors are read from the files that already own them, so
  // this page cannot drift out of step with research.html and people.html.
  // people.yaml is still needed: thesis cards resolve student and supervisor
  // names to profile links. research.yaml is not, now that the themes
  // section has gone.
  const [data, people] = await Promise.all([
    CMS.load('content/students.yaml'),
    CMS.load('content/people.yaml'),
  ]);
  document.getElementById('loading').remove();
  document.getElementById('studentPage').classList.remove('hidden');

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const txt = s => esc(String(s || '').trim());

  document.getElementById('heroLead').textContent = (data.intro || '').trim();

  // Resolve a name against people.yaml so it links to that person's profile,
  // and leave it as plain text when it matches nobody -- better a plain name
  // than a link to "not found". Used by the thesis cards.
  const byName = new Map((people || []).map(p => [String(p.name).trim(), p]));
  const linkName = n => {
    const p = byName.get(String(n).trim());
    return p && p.slug
      ? `<a href="people/?id=${encodeURIComponent(p.slug)}">${esc(n)}</a>`
      : esc(n);
  };

  // The chips say Bachelor and Masters rather than BSc and MSc: the group
  // takes students from programmes broader than those two designations. The
  // underlying `level` values are unchanged, because they are what matches a
  // programme to a track and what CMS.levelClass styles on.
  const LEVEL_LABEL = { BSc: 'Bachelor', MSc: 'Masters', PhD: 'PhD' };
  const levelLabel = l => LEVEL_LABEL[l] || l;

  const tracks = data.tracks || [];
  const progs = data.programmes || [];

  /* Overview cards: one per level, linking down to its own section. */
  document.getElementById('trackCards').innerHTML = tracks.map((t, i) => `
    <a class="track-card reveal" data-delay="${i * 55}" href="#${esc(t.id)}">
      <span class="level-badge ${CMS.levelClass(t.level)}">${esc(levelLabel(t.level))}</span>
      <h4>${txt(t.title)}</h4>
      <p>${txt(t.summary)}</p>
      <span class="track-more">Learn more →</span>
    </a>`).join('');

  /* One full section per level: the work, then the route, then the
     programmes that feed it. The PhD track has no programme_level, because
     there is no enrolment route into a PhD -- it runs on funded positions. */
  document.getElementById('trackSections').innerHTML = tracks.map((t, ti) => {
    const mine = progs.filter(p => t.programme_level && p.level === t.programme_level);
    const progHtml = mine.length ? `
      <h3 class="track-sub">Programmes that lead here</h3>
      <div class="grid grid-2" style="margin-bottom:8px">
        ${mine.map(p => `
          <div class="prog-card">
            <div style="margin-bottom:12px"><span class="level-badge ${CMS.levelClass(p.level)}">${esc(levelLabel(p.level))}</span></div>
            <h4>${txt(p.name)}</h4>
            <p>${txt(p.desc)}</p>
            <div class="prog-meta">
              <span>🏛 ${txt(p.dept)}</span>
              <span>📅 ${txt(p.duration)} · ${txt(p.language)}</span>
            </div>
            ${p.route_note ? `<div class="route-note">${txt(p.route_note)}</div>` : ''}
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
              <a href="${esc(p.url)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Programme →</a>
              ${p.curriculum_url ? `<a href="${esc(p.curriculum_url)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Curriculum →</a>` : ''}
            </div>
          </div>`).join('')}
      </div>` : '';

    /* Project descriptions, on the taught tracks only: a PhD is advertised as
       a funded vacancy, not listed as a project. `open` is empty today, so
       this renders the "where to look" note rather than a bare heading. Once
       real descriptions are added they appear here instead. */
    const PL = data.project_listing || {};
    const openList = (PL.open || []).filter(o => !o.level || o.level === t.level);
    const projHtml = t.programme_level ? `
          <h3 class="track-sub">Project descriptions</h3>
          <p style="font-size:0.88rem;margin-bottom:14px">${txt(PL.intro)}</p>
          ${openList.length ? `
            <div class="grid grid-2" style="margin-bottom:8px">
              ${openList.map(o => `
                <div class="prog-card">
                  <h4>${txt(o.title)}</h4>
                  <p>${txt(o.desc)}</p>
                  <div class="prog-meta"><span>${linkName(o.supervisor)}</span></div>
                </div>`).join('')}
            </div>`
          : `<div style="margin-bottom:8px">
              ${(PL.sources || []).map(src => `
                <div class="req-item"><div><strong>${txt(src.name)}</strong> — ${txt(src.text)}</div></div>`).join('')}
             </div>`}
    ` : '';

    /* Completed work at this level. Rendered only when there is some, so a
       level with nothing yet shows no empty heading. The student's name and
       any supervisor who is in people.yaml link to their profile; supervisors
       outside the group stay as plain text. */
    // Newest first, so adding an entry does not mean reordering the file.
    // Sorts on `date` where present, falling back to `year`.
    const when = h => Date.parse(h.date || '') || Number(h.year) || 0;
    const hl = (data.highlights || [])
      .filter(h => h.level === t.level)
      .slice()
      .sort((a, b) => when(b) - when(a));
    const hlHtml = hl.length ? `
          <h3 class="track-sub">Completed theses</h3>
          <div style="margin-bottom:28px">
            ${hl.map(h => `
              <div class="thesis-card">
                <div class="thesis-title">
                  ${/* Prefer the DOI: it is the persistent identifier, and it
                       resolves to the same CRIS page the portal URL points at,
                       so linking both would be two links to one destination. */''}
                  ${(h.doi || h.url)
                    ? `<a href="${esc(h.doi ? 'https://doi.org/' + h.doi : h.url)}" target="_blank" rel="noopener">${txt(h.title)}</a>`
                    : txt(h.title)}
                </div>
                <div class="thesis-meta">
                  ${linkName(h.name)}${h.date ? ` · ${txt(h.date)}` : ''}
                  ${h.programme ? `<br>${txt(h.programme)}` : ''}
                  ${/* Doctoral records say "Supervisor"; a master's title page
                       names a thesis committee, which includes examiners as
                       well as supervisors. Labelling both as supervision
                       would misattribute, so each entry says which it is. */''}
                  ${(h.supervisors || []).length
                    ? `<br>Supervised by ${h.supervisors.map(linkName).join(', ')}` : ''}
                  ${(h.committee || []).length
                    ? `<br>Thesis committee: ${h.committee.map(linkName).join(', ')}` : ''}
                </div>
                ${(h.abstract || '').trim()
                  ? `<details class="thesis-details">
                       <summary>${esc(h.abstract_label || 'Abstract')}</summary>
                       <div class="thesis-abstract">${txt(h.abstract)}</div>
                     </details>`
                  : ''}
                ${h.doi ? `<div class="thesis-doi">${esc(h.doi)}</div>` : ''}
              </div>`).join('')}
          </div>` : '';

    const isPhd = t.id === 'phd';
    const phdExtra = isPhd ? `
      <h3 class="track-sub">What we look for</h3>
      <div style="margin-bottom:26px">
        ${(data.phd_requirements || []).map(r => `<div class="req-item">${esc(r)}</div>`).join('')}
      </div>
      <h3 class="track-sub">Terms of employment</h3>
      <p style="font-size:0.88rem;margin-bottom:18px">${txt(data.phd_employment)}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${(data.links || {}).um_vacancies ? `<a href="${esc(data.links.um_vacancies)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">UM vacancies →</a>` : ''}
        ${(data.links || {}).academic_transfer ? `<a href="${esc(data.links.academic_transfer)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">AcademicTransfer →</a>` : ''}
      </div>` : '';

    return `
      <section id="${esc(t.id)}" class="${ti % 2 === 0 ? 'alt' : ''}" style="scroll-margin-top:120px">
        <div class="container" style="max-width:900px">
          <div class="section-header">
            <span class="section-label">${esc(levelLabel(t.level))}</span>
            <h2>${txt(t.title)}</h2>
            <p>${txt(t.summary)}</p>
          </div>

          <h3 class="track-sub">What the work looks like</h3>
          <div style="margin-bottom:28px">
            ${(t.work || []).map(w => `<div class="req-item">${esc(w)}</div>`).join('')}
          </div>

          ${hlHtml}

          <h3 class="track-sub">How to get onto it</h3>
          <p style="font-size:0.88rem;margin-bottom:20px">${txt(t.route_intro)}</p>
          <div class="phd-steps" style="margin-bottom:28px">
            ${(t.steps || []).map(st => `
              <div class="phd-step">
                <div class="step-num">${esc(st.number)}</div>
                <div><h4>${txt(st.title)}</h4><p>${txt(st.text)}</p></div>
              </div>`).join('')}
          </div>

          ${progHtml}
          ${projHtml}
          ${phdExtra}
        </div>
      </section>`;
  }).join('');

  CMS.revealNew(document.getElementById('studentPage'));

  const sects = ['bachelor', 'master', 'phd'];
  const navAs = document.querySelectorAll('.sticky-subnav a');
  window.addEventListener('scroll', () => {
    let cur = sects[0];
    for (const id of sects) {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= 160) cur = id;
    }
    navAs.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + cur));
  }, { passive: true });
})();
</script>
</body>
</html>
