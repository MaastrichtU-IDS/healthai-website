  text: "\U0001F3C6 We’re proud to announce that our Associate Professor Dr. Joël Karel has\
    \ received an NWO grant for his project “Let the signals self-calibrate: data-driven inverse\
    \ problem in electrocardiography”\nhttps://lnkd.in/eC6-mD45\n\nThe project addresses a\
    \ limitation in an important inverse problem in #cardiology: reconstructing the heart’s\
    \ electrical activity from measurements on the skin, known as electrocardiographic imaging\
    \ (ECGI). Current #ECGI requires medical imaging and precise knowledge of electrode positions,\
    \ which limits its use outside specialist centers. We will test whether small electrode\
    \ patches can “self-calibrate” the inverse problem, meaning that their relative positions\
    \ can be inferred directly from the recorded signals, without scans or manual localization.\
    \ If successful, this would remove a major practical barrier to ECGI and enable faster,\
    \ cheaper, and more accessible heart monitoring in primary care, ambulatory settings,\
    \ and at home.\n\n“I’m looking forward to addressing this with my team at Maastricht University\
    \ Department of Advanced Computing Sciences (DACS) | Institute of Data Science, Pietro\
    \ Bonizzi and Ralf Peeters”, Joel says. Congratulations!! \U0001F64C \U0001F973 \n\nℹ️\
    \ About the Open Competition Domain Science – XS by NWO (Dutch Research Council):\nThe\
    \ Open Competition Domain Science – XS grants are intended to support promising ideas\
    \ and to facilitate innovative and more speculative initiatives within the seven Domain\
    \ Science disciplines. The proposed research is ground-breaking and high-risk. What counts\
    \ is that all results, be they positive or negative, must contribute to the advancement\
    \ of science.\n\nMaastricht University - Faculty of Science and Engineering\n#ECGI #cardiology\
    \ #heartmonitoring #researchgrant #NWO"
