  text: "\U0001F680 Advancing Cardiovascular Care with Smarter, Standardised Health Data:\
    \ The CDE Mapper\n\nMaastricht University Institute of Data Science | Department of Advanced\
    \ Computing Sciences (DACS)'s Komal Gilani et al's CDE mapper in the spotlight:\nhttps://lnkd.in/eJTgUtMd\n\
    \nThe Innovative Health Initiative (IHI) heart disease project iCARE4CVD has delivered\
    \ an innovative new AI-based tool to harmonise and standardise health data in the cardiovascular\
    \ disease field, a key step towards advancing more personalised care: the CDE (Common\
    \ Data Element) Mapper.\n\nWith the CDE Mapper, the iCARE4CVD project is tackling a major\
    \ challenge in cardiovascular research: patient data is stored in many different formats\
    \ across hospitals, countries, and systems. This makes it difficult to analyse information\
    \ at scale. For example, even basic terms like “heart failure” might appear as HF or a\
    \ numerical code. The CDE mapper harmonises medical data by aligning it with internationally\
    \ recognised vocabularies. It uses retrieval-augmented generation (RAG), combining trusted\
    \ biomedical sources with large language models, to achieve highly accurate, reliable\
    \ mappings.\n\nThe CDE mapper was first introduced in the article by Komal Gilani, Marlo\
    \ Verket, Christof Peters, Michel Dumontier, Hans-Peter Brunner-La Rocca, and Visara Urovi\
    \ (Computers in Biology and Medicine 196 (2025) 110745): https://lnkd.in/dgxDsbWJ\n\n\
    In today's IHI Newsroom article, Komal Gilani explains: \n\"RAG works in two steps. First,\
    \ it searches the most relevant information from trusted sources, such as biomedical dictionaries\
    \ or the knowledge collected in iCARE4CVD. Then, it uses a large language model (a type\
    \ of AI that can understand and generate text) to create an answer based on that information.\
    \ We chose RAG because linking clinical data to standard medical codes requires high accuracy;\
    \ by checking against reliable medical sources, RAG ensures the AI’s answers are grounded\
    \ in real, verified biomedical knowledge\". \n\nThe team is now refining the tool to make\
    \ it faster, more flexible, and easier to use in real-world health care settings. The\
    \ CDE-Mapper also contributes to the implementation of the European Health Data Space\
    \ (EHDS).\n\nKomal: \"The EHDS aims to make health data across Europe more standardised\
    \ and interoperable. The CDE-Mapper can contribute to this goal by offering a scalable,\
    \ semi-automated way (with a human-in-loop approach) to align study data metadata with\
    \ international medical vocabularies. This makes it easier to share, integrate, and reuse\
    \ datasets for research, healthcare innovation, and public health\".\n\n#umdatascience\
    \ #datascience #iCARE4CVD #IHITransformingHealth #HealthResearch #EUResearch #HorizonEU\
    \ #HealthAI #HealthData #RAG #CardiovascularDisease #CVD #DataHarmonisation #CDE #CDEmapper\
    \ #LLM #EHDS #clinicaldatamapping #HealthAI #heartdisease #personalisedcare"
