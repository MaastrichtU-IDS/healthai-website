  text: "We're very proud to announce that Aditya S., Master Student at Maastricht University\
    \ Institute of Data Science | Department of Advanced Computing Sciences (DACS), received\
    \ the Best Paper Award for the paper “Self-Compressing Vision Tower for Efficient Dense\
    \ Prediction Tasks\", at last week's BNAIC2025 Conference!\U0001F3C6\nhttps://lnkd.in/eGYPw7pF\n\
    \nAditya is supervised by Dr. Chang Sun and Dr. Guangzhi Tang, both Assistant Professors\
    \ at DACS: Huge congratulations to Aditya, Chang, and Guangzhi for this fantastic achievement!\U0001F64C\
    \U0001F680  \n\nThe paper “Self-Compressing Vision Tower for Efficient Dense Prediction\
    \ Tasks,” introduces a novel self-compressing vision architecture that proportionally\
    \ applies structured pruning and quantization across convolutional layers, transposed\
    \ convolutions, and linear attention based on their parallel-time computational cost.\
    \ The paper also highlights how compression can help us better understand the relationship\
    \ between model depth and inference performance. \n\nRead more about the project at Aditya's\
    \ GitHub: https://lnkd.in/eJ9gG2Xr\n\n\U0001F449 BNAIC 2026 will be hosted at Maastricht\
    \ University from 21–23 October 2026. Stay tuned by following our website (https://lnkd.in/eR9NgSyd),\
    \ LinkedIn event page (https://lnkd.in/eVKDEGMu), and/or Instagram (instagram.com/bnaic2026/)!\n\
    \nMaastricht University Institute of Data Science | Department of Advanced Computing Sciences\
    \ (DACS) Maastricht University - Faculty of Science and Engineering BNAIC2025 #Award #Paper\
    \ #DensePrediction #ModelCompression #StructuredPruning #Quantization #EfficientVisionModels"
