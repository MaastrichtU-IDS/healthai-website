  text: '🌞 We’re proud to announce that our Distinguished Professor Michel Dumontier was selected
    as a member of the SCIANCE EU Project’s Life Sciences AISWG (AI in Science Working Groups). 

    https://lnkd.in/eTafS83C


    Ten AISWGs were established under the Horizon Europe-funded SCIANCE project, bringing
    together >150  experts in artificial intelligence, scientific research, research infrastructures,
    HPC, Open Science and innovation to co-create the European Strategic Research & Innovation
    Agenda (SRIA) for AI in Science. 

    Among other activities, AISWG members will help develop a future SRIA and advance AI-driven
    scientific discovery. The main objective of the working groups is to identify domain-specific
    and cross-cutting scientific priorities, critical gaps in access to scientific, AI, and
    data infrastructures, and co-design the SRIA.


    Prof. Michel Dumontier was one of the 150 experts (out of 665 applicants) selected for
    the SCIANCE AISWGs, together with 2 other Maastricht University experts: Dr. Bart Penders
    and Dr. Massimiliano Simons, who were selected as members of the Open Science & Trustworthy
    AI AISWG. Congratulations!!


    SCIANCE is a Horizon Europe Coordination and Support Action establishing the foundations
    for the Resource for AI Science in Europe (RAISE). The project brings together leading
    research infrastructures, scientific organisations, and AI centres of excellence to strengthen
    the integration of artificial intelligence in scientific research.


    Through a collaborative and community-driven process, SCIANCE develops the AI in Science
    Strategic Research and Innovation Agenda (SRIA), identifying key research challenges,
    priorities for AI-enabled discovery, and the infrastructure upgrades needed to support
    them.


    The RAISE initiative aims to provide a long-term European framework connecting AI technologies,
    research infrastructures, computing resources, and scientific communities to accelerate
    discovery across disciplines.


    Read more about the SCIANCE EU Project on the website: https://www.sciance.eu/


    Subscribe to the SCIANCE EU Project Newsletter: https://lnkd.in/ewgJzaJ4


    Maastricht University - Faculty of Science and Engineering Maastricht University Brussels
