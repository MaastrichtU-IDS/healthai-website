  text: "We are proud to announce that the article \"Assessing Data Quality in Heterogeneous\
    \ Health Care Integration: Simulation Study of the AIDAVA Framework\", by Jens Declerck,\
    \ Dipak Kalra (Department of Public Health and Primary Care Ghent University, The European\
    \ Institute for Innovation Through Health Data), Isabelle de Zegher (B!loba), and our\
    \ colleagues Omer Durukan Kilic, Ensar Emir EROL, Mehryar S, and Remzi Celebi (Maastricht\
    \ University Institute of Data Science | Department of Advanced Computing Sciences (DACS)\
    \ was published in JMIR Publications: https://lnkd.in/ew6TjUYC\n\nIn this study, a newly\
    \ developed quality framework for patient-specific health records was tested as part of\
    \ the AIDAVA project. Unlike traditional health data quality checks (e.g., OMOP-based),\
    \ knowledge-graph technologies and SHACL (Shapes Constraint Language) rules were utilized\
    \ to assess the quality of dynamically evolving patient health knowledge graphs. The researchers\
    \ extended the set of quality checks, categorized different types of rules, and evaluated\
    \ data quality using simulated real-world noise on the MIMIC-III dataset. In the future,\
    \ they plan to develop an OMOP-based RDF schema and implement SHACL constraints that support\
    \ interoperability with OHDSI tools, and promote the broader adoption of semantic, constraint-driven\
    \ approaches to data quality.\n\nCongratulations!\U0001F44F\U0001F44F\U0001F44F \n\nMaastricht\
    \ University - Faculty of Science and Engineering Maastricht University Faculty of Health,\
    \ Medicine and Life Sciences, Maastricht UMC+\n#umdatascience #datascience #healthdata\
    \ #dataquality #knowledgegraph #healthcare #interoperability #AIDAVA"
