  text: "‼️Article Alert \U0001F447 \nWe're proud to present the article \"CMEO: a metadata-centric\
    \ ontology for clinical studies exploration and harmonization assessment\", by our colleague\
    \ Komal Gilani and her co-authors, Wei Wei, MD, MSc, MPH, Christof Peters, Marlo Verket, Hans-Peter\
    \ Brunner-La Rocca, Enrico Nicolis, Martina Colombo, Prof. Dr. med. Katharina Marx-Schütt, Visara\
    \ Urovi, and Michel Dumontier: https://lnkd.in/eAcE7mk7\n\nIn this article, the authors\
    \ present the \"Clinical Metadata Exploration Ontology\" (CMEO) that builds upon well-established\
    \ ontologies to provide a cohesive representation of study designs, data elements, exploratory\
    \ statistics, and data reuse permissions. CMEO facilitates semantic querying for study\
    \ exploration and comparison of data elements across studies, particularly when individual-level\
    \ data cannot be shared. We demonstrate its utility using metadata from five studies:\
    \ four heart-failure studies and one wearable-based type 1 diabetes study. \nThis FAIR-compliant,\
    \ metadata-driven integration across heterogeneous sources enables scalable, privacy-conscious\
    \ research and underpins federated clinical data exploration.\n\nRead the full article\
    \ here: https://lnkd.in/eAcE7mk7\n\nThis work was supported by the iCARE4CVD project,\
    \ funded under the\nInnovative Health Initiative (IHI) Joint Undertaking (IHI JU).\n\n\
    Maastricht University - Faculty of Science and Engineering Maastricht University Institute\
    \ of Data Science | Department of Advanced Computing Sciences (DACS) Maastricht University\
    \ | Faculty of Health, Medicine and Life Sciences Care And Public Health Research Institute\
    \ (CAPHRI) Cardiovascular Research Institute Maastricht (CARIM) RWTH Aachen University\
    \ Istituto Mario Negri Istituto Mario Negri - Medical Imaging Lab"
