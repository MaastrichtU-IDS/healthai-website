  text: "\U0001F64C We’re proud to announce that our colleague Dr. Rohan Nanda has been awarded\
    \ a Comenius Teaching Fellow grant by Nationaal Kennisinstituut Onderwijs (NKO), together\
    \ with Dr. Henrique Marcos, for their project \"AI Due Diligence Lab for the Blue Economy\
    \ (#BlueLab) \U0001F3C6 \n https://lnkd.in/eJ3fTxjs\n\n#BlueLab is an innovative learning\
    \ environment that helps students develop responsible AI practices while working on realistic\
    \ #ESG (Environmental, Social, and Governance) compliance cases in the blue economy. By\
    \ combining legal expertise, sustainability challenges, and AI-supported analysis, the\
    \ project prepares students for the realities of professional practice and teaches them\
    \ to critically assess and verify AI-generated outputs.\n\n#ESG compliance generates vast\
    \ and fragmented regulatory documentation that can no longer be managed without AI, yet\
    \ graduates leave university without training in how to use these tools responsibly. BlueLab\
    \ develops an AI-supported compliance workflow integrating retrieval-augmented generation\
    \ (RAG), a curated legal knowledge base, and verification guardrails, where students act\
    \ as compliance officers analysing fragmented regulatory texts. The goal is to teach responsible\
    \ AI use in professional practice.\n\nShashank Chakravarthy, software engineer at BISS\
    \ - Brightlands Institute for Smart Society, will support the project's technical development\
    \ and the long-term maintenance of the dashboard. \n\nRead the full article \U0001F449\
    \ https://lnkd.in/eJ3fTxjs\n\nMaastricht University Faculty of Law, Maastricht Law & Tech\
    \ Lab, Maastricht University - Faculty of Science and Engineering\n\n#ResponsibleAI #LegalTech\
    \ #LegalEducation #RAG #LLM #ESG #MaastrichtUniversity #LawinMaastricht #NLP #BlueEconomy"
