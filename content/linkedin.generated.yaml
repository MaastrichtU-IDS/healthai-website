  text: '🔄Farewell to the Programme Director, Hail to the Programme Director👏


    As of 1 October, Pietro Bonizzi, who coordinated the successful launch of the bachelor''s
    programme in Computer Science, has passed the mantle of programme director to Ashish Sai🎓💻

     

    Ashish Sai is an Assistant Professor at our Department, specialising in distributed systems,
    cybersecurity and software engineering research. Alongside his research, he has a strong
    focus on education, teaching both undergraduate and graduate-level courses in computer
    science and software engineering, a passion that led to his appointment as programme director.

     

    "The programme has come a long way in a short time, and it is a privilege to take it on
    at this stage. My priority is to build on the strong foundation Pietro and our colleagues
    have created and to keep developing the programme as it matures", says Ashish about his
    plans.

     

    Pietro Bonizzi, the programme''s first director, helped implement Computer Science from
    the ground up. Following a successful start and the graduation of its first students this
    summer, Pietro is stepping down, as originally planned.

    "I’m very honoured that I was given the opportunity to coordinate the implementation of
    this new programme. I have learned a lot on the way, personally and professionally. We
    have a solid programme by now, and this is also thanks to all colleagues who put a lot
    of effort into it, Ashish among all", says Pietro about his experiences at Computer Science.

     

    Pietro will, of course, remain programme director of the bachelor''s programme in Data
    Science and Artificial Intelligence🎓🤖


    ~Text by Patrick Marx


    Maastricht University - Faculty of Science and Engineering

