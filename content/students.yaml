# Students page.
#
# PURPOSE, as set by Michel: (i) show the work the group does with students at
# bachelor's, master's and PhD level, and (ii) give each of those three a
# concrete path to follow. The bachelor's and master's routes run through
# enrolling in a relevant programme and taking its courses; the PhD route runs
# through funded positions, which have to exist before they can be applied for.
# The page is therefore organised by level, not by topic.
#
# EVERY CLAIM HERE MUST BE CHECKABLE. The previous version of this file was
# removed because it was not: it named six students who do not appear to
# exist, credited each with a specific result, and attributed them to real
# supervisors. See PR #15.
#
# Two rules for anything added:
#   1. No named person without their knowledge, and no claim about a person
#      they have not confirmed.
#   2. No number nobody will maintain. Salary scales, ECTS and cohort sizes go
#      stale silently and are better linked than copied.
#
# INCOMPLETE: the programme list below covers DACS and UCM. Michel has
# flagged that the group takes students from more programmes than these, and
# that an inventory is needed. See issue #17.
#
# Research themes and supervisors are NOT listed here. The page reads them from
# research.yaml and people.yaml at render time, so they cannot drift.

intro: >
  We work with students at every level, from a first bachelor's project to a
  four-year PhD. Projects come out of the group's own research, so the work is
  part of something ongoing rather than an exercise set aside for a student.

# The three tracks. Each says what the work is, then how to get onto it.
tracks:
  - id: bachelor
    level: BSc
    title: Bachelor's projects
    programme_level: BSc
    summary: >
      A scoped piece of a larger research question, usually carried out in your
      final year alongside the group members working on that question.
    work:
      - Building or extending a tool, pipeline or dataset the group actually uses
      - Evaluating an existing method on a new dataset or in a new setting
      - Making research output usable by others, through interfaces, documentation or visualisation
    route_intro: >
      The bachelor's route runs through the programme. Supervision is arranged
      once you are enrolled and have reached the project stage.
    steps:
      - number: "1"
        title: Enrol in a relevant bachelor's programme
        text: >
          Most students who do a project with us come from Data Science and
          Artificial Intelligence at DACS. We also supervise University College
          Maastricht students through the Capstone, their final research
          project. Any UM bachelor's that leaves you able to program and reason
          about data can work.
      - number: "2"
        title: Take the courses that match the work
        text: >
          Your programme's curriculum is what prepares you for a project here.
          Choose the machine learning, data and knowledge representation
          courses in the direction you want to work.
      - number: "3"
        title: Approach a supervisor before the project period
        text: >
          Email a staff member whose theme fits, a few months before the
          project period starts rather than at the start of it. Places are
          arranged person to person, and good ones go early.
      - number: "4"
        title: Shape the project together
        text: >
          The first conversations turn an interest into a question that can be
          answered in the time a bachelor's project allows.

  - id: master
    level: MSc
    title: Master's theses and internships
    programme_level: MSc
    summary: >
      A research question of your own within one of the group's themes, at a
      scale where the result can stand on its own. Research internships are
      arranged the same way.
    work:
      - Thesis research on an open question in one of the group's themes
      - Research internships, including with our clinical and industry partners
      - Work that, where it stands up, feeds into the group's publications, software and datasets
    route_intro: >
      The master's route also runs through the programme, and the thesis is
      where the research work happens.
    steps:
      - number: "1"
        title: Enrol in a relevant master's programme
        text: >
          The three DACS master's programmes below are the usual routes. We
          also supervise students from elsewhere in UM, and from other
          universities for internships.
      - number: "2"
        title: Take the courses that match the work
        text: >
          Use the elective space in your curriculum to build toward the kind of
          thesis you want. The curriculum links below show what each programme
          offers.
      - number: "3"
        title: Contact a supervisor well before the thesis period
        text: >
          Write to the staff member whose theme fits. Say what in their work
          interests you and why, your programme and stage, and when you need to
          start and finish.
      - number: "4"
        title: Agree a question, then do the research
        text: >
          Supervisors rarely hand over a finished brief. You will have a named
          academic supervisor, and often a PhD researcher or postdoc close to
          the topic for day-to-day work.

  - id: phd
    level: PhD
    title: PhD positions
    programme_level: null
    summary: >
      Four years of employed research on your own line of work, ending in a
      thesis and a body of publications.
    work:
      - An original line of research within one of the group's themes
      - Publishing and presenting your own work internationally
      - Supervising bachelor's and master's students, and contributing to teaching
    route_intro: >
      The PhD route is different from the other two. PhD candidates in the
      Netherlands are employed rather than funded by a stipend, so a position
      has to exist and be funded before it can be applied for. There is no
      enrolment route in.
    steps:
      - number: "1"
        title: Wait for a funded position to be advertised
        text: >
          Positions appear when a project is funded, and are posted on UM's
          vacancies site and on AcademicTransfer with a project description and
          requirements.
      - number: "2"
        title: Or bring your own funding
        text: >
          If you hold or are applying for a personal fellowship or a national
          scholarship, approach a prospective supervisor directly and early.
          This route is slower and needs a concrete research idea.
      - number: "3"
        title: Apply to the specific project
        text: >
          Applications normally ask for a CV, a motivation letter, transcripts
          and referees. Write to the project that was advertised rather than
          sending a general application.
      - number: "4"
        title: Interview and employment
        text: >
          Shortlisted candidates are interviewed by the supervisor and at least
          one other panel member. A successful candidate receives an employment
          contract.

phd_requirements:
  - A master's degree in computer science, data science, bioinformatics or a closely related field
  - Programming ability sufficient to carry your own research code
  - Interest in health and the life sciences; a medical background is not required
  - Some evidence of research ability, such as a thesis, a publication or a substantial open-source contribution
  - Working English; Dutch is not required

# No euro figures on purpose. The previous version quoted a range that was
# already out of date, and these change yearly under the CAO.
phd_employment: >
  PhD candidates are employed on scale P of the collective labour agreement for
  Dutch universities (CAO NU), with holiday allowance, an end-of-year payment
  and the associated social security. Current figures are stated in each
  advertised vacancy.

