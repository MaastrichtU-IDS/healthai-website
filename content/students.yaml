# Students page.
#
# EVERY CLAIM ON THIS PAGE MUST BE CHECKABLE. The previous version of this
# file was removed because it was not: it named six students who do not
# appear to exist, credited each with a specific result, and attributed them
# to real supervisors. See PR #15.
#
# Two rules for anything added here:
#   1. No named person without their knowledge, and no claim about a person
#      that they have not confirmed.
#   2. No number that nobody is going to maintain. Salary scales, country
#      counts and cohort sizes go stale silently and are better linked than
#      copied.
#
# Research themes and supervisors are NOT listed here. The page reads them
# from research.yaml and people.yaml at render time, so they cannot drift out
# of step with the rest of the site.

intro: >
  We supervise bachelor's and master's theses, research internships and PhD
  projects in health AI. Projects are drawn from the group's own research,
  so the work is part of something ongoing rather than an exercise set aside
  for a student.

working_with_us:
  - icon: "🔍"
    title: Start from a question, not a method
    text: >
      Projects begin with a scientific or clinical question. Which methods
      suit it is something you work out together with your supervisor, rather
      than something fixed before you start.

  - icon: "👥"
    title: A named supervisor
    text: >
      Every project has a named academic supervisor from the group. Day-to-day
      you will often also work with a PhD researcher or postdoc close to the
      topic.

  - icon: "🔗"
    title: Real data, and its constraints
    text: >
      Much of our work uses health data, which brings governance, privacy and
      access conditions with it. Part of the project is learning to work
      inside those constraints rather than around them.

  - icon: "📤"
    title: Work that goes somewhere
    text: >
      Student work that stands up feeds into the group's publications,
      software and datasets. Where that happens, contributions are credited.

# How to approach the group. This is the part that replaces the invented list
# of nine open projects: it is true on day one and needs no maintenance.
approach:
  - number: "1"
    title: Find a theme that fits
    text: >
      Look through the research themes below and the group's recent
      publications. You are looking for an area you want to spend months in,
      not a precise title.

  - number: "2"
    title: Email a supervisor directly
    text: >
      Write to the staff member whose theme fits. There is no central intake
      for thesis projects; supervision is arranged person to person.

  - number: "3"
    title: Say something specific
    text: >
      Include your programme and stage, what in their work interests you and
      why, and roughly when you need to start and finish. A short paragraph
      that shows you have read something of theirs is worth more than a CV
      alone.

  - number: "4"
    title: Shape the project together
    text: >
      Supervisors rarely hand over a finished brief. The first conversations
      are about turning an interest into a question that can actually be
      answered in the time available.

programmes_intro: >
