phd_intro: >
  PhD candidates in the Netherlands are employed, not funded by a stipend. A
  position therefore has to exist and be advertised before it can be applied
  for, and that is the main thing worth understanding about the route.

phd_steps:
  - number: "1"
    title: Wait for an advertised position
    text: >
      Positions appear when a project is funded. They are posted on UM's own
      vacancies site and on AcademicTransfer, each with a project description
      and requirements.

  - number: "2"
    title: Or bring your own funding
    text: >
      If you hold or are applying for a personal fellowship or a national
      scholarship, approach a prospective supervisor directly and early. This
      route takes longer and needs a concrete research idea.

  - number: "3"
    title: Apply to the advertised position
    text: >
      Applications normally ask for a CV, a motivation letter, transcripts and
      referees. Write to the specific project rather than sending a general
      application.

  - number: "4"
    title: Interview and offer
    text: >
      Shortlisted candidates are interviewed by the supervisor and at least
      one other panel member. A successful candidate receives an employment
      contract.

phd_requirements:
  - A master's degree in computer science, data science, bioinformatics or a closely related field
  - Programming ability sufficient to carry your own research code
  - Interest in health and the life sciences; a medical background is not required
  - Some evidence of research ability, such as a thesis, a publication or a substantial open-source contribution
  - Working English; Dutch is not required

# No euro figures here on purpose. The previous version quoted a range that
# was already out of date, and these change yearly under the CAO.
phd_employment: >
  PhD candidates are employed on scale P of the collective labour agreement
  for Dutch universities (CAO NU), with holiday allowance, an end-of-year
  payment and the associated social security. Current figures are stated in
  each advertised vacancy.

links:
  um_vacancies: https://www.maastrichtuniversity.nl/about-um/work-at-um
  academic_transfer: https://www.academictransfer.com/en/
