# WHERE PROJECT DESCRIPTIONS LIVE.
#
# DACS publishes bachelor's and master's project descriptions in Canvas,
# which only enrolled students can see. The intent is to post them here too,
# and eventually to synchronise rather than maintain two lists. Until that
# exists, this section says where to look rather than pretending to be the
# list -- the page it replaced invented nine projects.
#
# To publish projects here, add entries under `open`. Each needs a real
# supervisor who has agreed to it. An empty list renders as the "where to
# look" note alone, not an empty heading.
project_listing:
  intro: >
    Project descriptions are published by each programme, and we are working
    toward listing ours here as well.
  sources:
    - name: DACS projects
      text: >
        Bachelor's and master's project descriptions for the DACS programmes
        are posted in Canvas, where enrolled students can see them.
    - name: UCM Capstone
      text: >
        UCM students choose a Capstone topic and advisor through their own
        programme's procedure, in their final semester.
  open: []

