# COMPLETED WORK.
#
# Sourced from Pure, but not through its API: the ResearchOutput endpoint
# returns a trimmed record (electronicVersions, info, language, renderings,
# subTitle, title, uuid) with no type, author or abstract, so it cannot tell
# a doctoral thesis from a journal article or say whose it is. Asking for a
# record by its own uuid returns an unrelated one. These were therefore read
# off the public CRIS portal pages, which do carry the detail.
#
# Every field in the three doctoral entries is on the cited page. Their
# `name` is how the person is listed in people.yaml rather than the full
# legal name on the thesis, so it resolves to their profile; Gijs appears on
# the thesis as Gijsbert Willem Adriaan Wijngaard. Doctoral candidates are
# named because the university published these theses, with DOIs. The
# master's and bachelor's entries below have no `name` at all.
#
# Supervisors outside the group render as plain text, which is correct.
highlights:
  - level: PhD
    name: Chang Sun
    title: Privacy-preserving personal data analysis
    year: "2022"
    theme: federated
    date: 14 November 2022
    supervisors:
      - Michel Dumontier
      - Johan van Soest
    doi: 10.26481/dis.20221114cs
    url: https://cris.maastrichtuniversity.nl/en/publications/privacy-preserving-personal-data-analysis/
    abstract: >
      Ever-increasing amount of data is generated by our citizens and used in
      our daily life every single day. These massive amounts of data can be
      used to improve digital technologies and develop data-driven innovations
      that can impact every aspect of people’s lives. However, lack of sharing
      of, access to and reuse of these data hinders the analysis possibilities
      and hence potential insights from the data. A number of challenges have
      been recognized such as technical barriers, security, data protection
      compliance to one or more legal jurisdictions, privacy concerns, and
      trust issues. This thesis aims to develop new privacy-preserving data
      sharing and analysis techniques that strengthen and extend the (re-)use
      of personal data while maximally protecting individuals’ privacy. To
      achieve this aim, this thesis addressed the research challenges on
      personal data sharing and use from perspectives of data organisations,
      scientific researchers, and individuals (citizens).

  - level: PhD
    name: Gijs Wijngaard
    title: Data and semantic reasoning in audio-language learning
    year: "2026"
    theme: fair
    date: 7 September 2026
    supervisors:
      - Elia Formisano
      - Michel Dumontier
    doi: 10.26481/dis.20260907gw
    url: https://cris.maastrichtuniversity.nl/en/publications/data-and-semantic-reasoning-in-audio-language-learning/
    # NOT the CRIS abstract: this record has no abstract field, unlike Chang
    # Sun's. Condensed by Claude from the thesis's own lay summary, which
    # Michel supplied. Labelled "Summary" on the page rather than "Abstract",
    # because it is neither the CRIS abstract nor the author's own wording.
    # Replace with Gijs's own paragraph if he would rather write one.
    abstract_label: Summary
    abstract: >
      This thesis asks how computers can learn to understand sound and
      describe it in language, approaching what a person does on hearing a dog
      bark: recognise it at once and say what is happening. It contributes in
      five parts. A survey of 69 audio-language datasets maps where the
      field's training data comes from and finds substantial overlap between
      sets, which flatters reported performance. A curriculum approach then
      introduces training examples in order of difficulty, filters duplicates
      and rebalances overrepresented sound categories, improving audio
      question answering without extra computation. AudSemThinker, trained on
      AudSem, a new dataset built from YouTube subtitles and designed not to
      overlap existing test sets, reasons explicitly about what is making a
      sound, how it is produced and where it occurs before answering. ACES, a
      new evaluation metric, judges generated descriptions by whether they
      capture those semantic elements rather than by word overlap. Finally,
      AudioToolAgent coordinates several specialised models, delegating speech
      to a recogniser while consulting others for environmental sound and
      music, reaching strong benchmark results while staying modular by
      reusing pre-trained models.

  - level: PhD
    name: Weiwei Wang
    title: Category data embedding
    year: "2025"
    theme: fair
    date: 22 May 2025
    supervisors:
      - Michel Dumontier
      - Stefano Bromuri
    doi: 10.26481/dis.20250522ww
    url: https://cris.maastrichtuniversity.nl/en/publications/category-data-embedding/
    # NOT the CRIS abstract: this record has none either. Condensed by Claude
    # from the thesis's own summary, supplied by Michel. See the note on
    # Gijs's entry.
    abstract_label: Summary
    abstract: >
      This thesis represents categorical data by turning tables into graphs,
      developing three graph-based approaches that connect tabular data to
      graph embedding methods and recover relationships between categories
      that ordinary encodings lose. It opens with a survey of categorical
      feature representation, grouping existing methods by the properties of
      the embedding function, the data structure and the complexity of the
      technique, with benchmark implementations released on GitHub and a
      practical guide to applying them. The first method treats each decision
      tree in a random forest as a graph, with nodes as splitting points, and
      learns node embeddings with Node2Vec from random walks over them; used
      as additional features these improve classification, and they also yield
      segmentation rules for particular populations. The second builds
      semantic graphs from logistic regression coefficients and domain expert
      input and learns embeddings with TransE, showing on two public datasets
      that encoding domain meaning between categories improves models. The
      third derives an adjacency matrix from the co-occurrence of categorical
      values and learns embeddings with a graph neural network using the
      DiffPool assignment matrix, demonstrated at scale on three public
      datasets.

